<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #fff;
      overflow: hidden;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      aspect-ratio: 1000 / 1800;
      height: 100%;
      width: auto;
      max-width: 100%;
      max-height: 100%;
      display: block;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      text-align: center;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #89b4fa;
      border-radius: 4px;
      transition: width 0.2s;
    }

    #unity-loading-text {
      color: #cdd6f4;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading-bar">
    <div id="unity-loading-text">Laden...</div>
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>

  <script>
    var buildUrl     = "Build";
    var canvas       = document.getElementById("unity-canvas");
    var loadingBar   = document.getElementById("unity-loading-bar");
    var progressFull = document.getElementById("unity-progress-bar-full");
    var loadingText  = document.getElementById("unity-loading-text");

    var config = {
      dataUrl:            buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl:       buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl:            buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName:        "{{{ COMPANY_NAME }}}",
      productName:        "{{{ PRODUCT_NAME }}}",
      productVersion:     "{{{ PRODUCT_VERSION }}}",
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function() {
      createUnityInstance(canvas, config, function(progress) {
        progressFull.style.width = (progress * 100) + "%";
        loadingText.innerText = "Laden... " + Math.round(progress * 100) + "%";
      }).then(function() {
        loadingBar.style.display = "none";
      }).catch(function(message) {
        alert("Fehler: " + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
